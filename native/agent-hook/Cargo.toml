[package]
name = "mohivx-hook"
version = "1.3.2"
edition = "2021"
license = "MIT"
description = "MOHIVX agent hook relay, adapted from Coucou"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
strip = true
opt-level = "s"
