<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hitodama Ghost Cursor Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      pointer-events: none;
      user-select: none;
    }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const { ipcRenderer } = require('electron');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Active Ghost Cursor Animations Queue
    let activeParticles = [];
    let isLoopRunning = false;

    class GhostCursor {
      constructor(startX, startY, endX, endY, label = '') {
        this.startX = startX;
        this.startY = startY;
        this.endX = endX;
        this.endY = endY;
        this.label = label;
        this.progress = 0;
        this.duration = 750; // ms
        this.startTime = performance.now();
        this.trail = [];
        this.ripples = [];
        this.sparks = [];
        this.hasClicked = false;
        this.done = false;

        // Curve control point (gives an organic, lifelike swoop)
        const midX = (startX + endX) / 2 + (Math.random() > 0.5 ? 90 : -90);
        const midY = Math.min(startY, endY) + Math.abs(endY - startY) * 0.4 + 40;
        this.ctrlX = midX;
        this.ctrlY = midY;
      }

      // Quadratic Bezier interpolation
      getPoint(t) {
        const invT = 1 - t;
        const x = invT * invT * this.startX + 2 * invT * t * this.ctrlX + t * t * this.endX;
        const y = invT * invT * this.startY + 2 * invT * t * this.ctrlY + t * t * this.endY;
        return { x, y };
      }

      update(now) {
        const elapsed = now - this.startTime;
        this.progress = Math.min(1, elapsed / this.duration);

        // Smooth cubic ease-out
        const t = 1 - Math.pow(1 - this.progress, 3);
        const currentPos = this.getPoint(t);
        this.currentPos = currentPos;

        // Record trailing positions
        this.trail.push({ x: currentPos.x, y: currentPos.y, alpha: 1.0, size: 7 });
        if (this.trail.length > 22) this.trail.shift();

        // Decay trail
        for (const pt of this.trail) {
          pt.alpha *= 0.92;
        }

        // Trigger Click Ripple when reaching destination
        if (this.progress >= 0.96 && !this.hasClicked) {
          this.hasClicked = true;
          this.ripples.push({ r: 4, maxR: 45, alpha: 1.0, color: '#38bdf8' });
          this.ripples.push({ r: 2, maxR: 65, alpha: 0.7, color: '#a855f7' });

          // Burst sparkles
          for (let i = 0; i < 14; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 1.5 + Math.random() * 3.5;
            this.sparks.push({
              x: this.endX,
              y: this.endY,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              alpha: 1.0,
              size: 2 + Math.random() * 2.5,
              color: i % 2 === 0 ? '#38bdf8' : '#e0e7ff'
            });
          }
        }

        // Update ripples
        for (const rip of this.ripples) {
          rip.r += 2.2;
          rip.alpha -= 0.035;
        }
        this.ripples = this.ripples.filter(r => r.alpha > 0);

        // Update sparks
        for (const spk of this.sparks) {
          spk.x += spk.vx;
          spk.y += spk.vy;
          spk.alpha -= 0.03;
        }
        this.sparks = this.sparks.filter(s => s.alpha > 0);

        if (this.progress >= 1 && this.ripples.length === 0 && this.sparks.length === 0) {
          this.done = true;
        }
      }

      draw(ctx) {
        // Draw trailing comet tail
        for (let i = 0; i < this.trail.length; i++) {
          const pt = this.trail[i];
          const radius = (i / this.trail.length) * 6;
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(56, 189, 248, ${pt.alpha * 0.75})`;
          ctx.shadowColor = '#0284c7';
          ctx.shadowBlur = 10;
          ctx.fill();
        }

        // Draw Soul Orb Head
        if (this.currentPos && this.progress < 1) {
          const { x, y } = this.currentPos;

          // Outer celestial halo
          const grad = ctx.createRadialGradient(x, y, 2, x, y, 18);
          grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
          grad.addColorStop(0.3, 'rgba(56, 189, 248, 0.85)');
          grad.addColorStop(0.7, 'rgba(168, 85, 247, 0.4)');
          grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

          ctx.beginPath();
          ctx.arc(x, y, 18, 0, Math.PI * 2);
          ctx.fillStyle = grad;
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 16;
          ctx.fill();

          // Core White Spark
          ctx.beginPath();
          ctx.arc(x, y, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.shadowBlur = 4;
          ctx.fill();

          // Floating mini badge
          if (this.label) {
            ctx.font = '600 11px system-ui, sans-serif';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 6;
            ctx.fillText(this.label, x + 16, y - 8);
          }
        }

        // Draw Ripples
        for (const rip of this.ripples) {
          ctx.beginPath();
          ctx.arc(this.endX, this.endY, rip.r, 0, Math.PI * 2);
          ctx.strokeStyle = rip.color;
          ctx.lineWidth = 2.5;
          ctx.globalAlpha = Math.max(0, rip.alpha);
          ctx.shadowColor = rip.color;
          ctx.shadowBlur = 12;
          ctx.stroke();
          ctx.globalAlpha = 1.0;
        }

        // Draw Sparks
        for (const spk of this.sparks) {
          ctx.beginPath();
          ctx.arc(spk.x, spk.y, spk.size, 0, Math.PI * 2);
          ctx.fillStyle = spk.color;
          ctx.globalAlpha = Math.max(0, spk.alpha);
          ctx.shadowColor = spk.color;
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.globalAlpha = 1.0;
        }
      }
    }

    function renderLoop(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = activeParticles.length - 1; i >= 0; i--) {
        const gc = activeParticles[i];
        gc.update(now);
        gc.draw(ctx);
        if (gc.done) {
          activeParticles.splice(i, 1);
        }
      }

      if (activeParticles.length > 0) {
        requestAnimationFrame(renderLoop);
      } else {
        isLoopRunning = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // Notify electron main that animation finished so it can hide or sleep overlay
        ipcRenderer.send('ghost-cursor-animation-complete');
      }
    }

    ipcRenderer.on('start-ghost-cursor', (event, data) => {
      const startX = data.startX || window.innerWidth / 2;
      const startY = data.startY || 20;
      const endX = data.endX || (window.innerWidth / 2 + (Math.random() * 200 - 100));
      const endY = data.endY || (window.innerHeight * 0.45);
      const label = data.label || '';

      const cursor = new GhostCursor(startX, startY, endX, endY, label);
      activeParticles.push(cursor);

      if (!isLoopRunning) {
        isLoopRunning = true;
        requestAnimationFrame(renderLoop);
      }
    });
  </script>
</body>
</html>
